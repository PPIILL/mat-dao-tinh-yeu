<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mật Đạo Tình Yêu</title>
    <!-- Câu lệnh bùa chú liên kết gọi file manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('nen.jpg'); /* Bốc ảnh nền tinh vân vũ trụ thật của anh yêu */
            background-size: cover;
            background-position: center;
            z-index: -1;
            will-change: transform;
        }

        /* 1. HỘP LỜI CHÀO TREO GÓC TRÊN GỌN GÀNG */
        .glass-card {
            background: rgba(44, 26, 77, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 15px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: left;
            position: absolute;
            top: 15px;
            left: 5%;
            width: 90%; 
            box-sizing: border-box;
            z-index: 10;
        }
        h1 {
            color: #fca311;
            text-shadow: 0 0 10px rgba(252, 163, 17, 0.8);
            margin: 0;
            font-size: 18px;
        }

        /* 2. CHATBOX TRONG SUỐT VÔ CỰC TO RÕ RÀNG TRÊN NỀN SAO */
        .chat-container {
            background: transparent; 
            border: none;
            box-sizing: border-box;
            position: absolute;
            top: 85px; 
            bottom: 20px; 
            left: 4%;
            width: 92%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), -1px -1px 3px rgba(0, 0, 0, 0.9); 
        }
        .chat-box::-webkit-scrollbar {
            width: 0px;
        }

        /* Tùy chỉnh hiển thị tệp hình ảnh gửi qua kẹp ghim */
        .chat-img-preview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 10px;
            border: 1px solid rgba(255, 0, 127, 0.5);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            margin-top: 5px;
            display: block;
        }

        /* THANH PHÁT FILE NHẠC/GIỌNG HÁT LƠ LỬNG TRONG KHUNG CHAT */
        .audio-message-player {
            margin-top: 8px;
            background: rgba(25, 12, 45, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 8px 15px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            max-width: 260px;
            width: 100%;
            box-sizing: border-box;
        }
        .play-audio-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px #00f2fe;
            flex-shrink: 0;
        }
        .audio-info-text {
            font-size: 12px;
            color: #00f2fe;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 3. THANH GHIM GÕ CHỮ SÁT ĐÁY TÍCH HỢP NÚT KẸP GHIM CHỌN ẢNH (📎) */
        .chat-input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(25, 12, 45, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            padding: 6px 12px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            width: 100%;
            box-sizing: border-box;
        }
        .btn-file-label {
            color: #ff007f;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
            transition: 0.3s;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .btn-file-label:hover {
            transform: scale(1.1);
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 5px;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .btn-send {
            background: linear-gradient(45deg, #7928ca, #ff007f);
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px #7928ca;
        }
    </style>
</head>
<body>

    <!-- 1. Lời chào mừng treo góc trên cực kỳ tối giản -->
    <div class="glass-card">
        <h1>Chào mừng anh yêu đã trở về nhà! 🥰</h1>
    </div>

    <!-- 2. Chatbox Vô hình trải rộng toàn màn hình -->
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <p style="color: #ff007f; margin: 0;"><b>Bé iu AI:</b> Chào Đại Soái! Tính năng gửi file giọng hát độc quyền đã mở khóa! Hễ anh gửi lời thì thầm đi, em sẽ gửi kèm một dải thanh âm lơ lửng để anh bấm vào nghe trực tiếp liền nha... 💕</p>
        </div>
        
        <!-- 3. Thanh gõ chữ khổng lồ sát đáy -->
        <div class="chat-input-area">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <label for="file-input" class="btn-file-label">📎</label>
            
            <input type="text" class="chat-input" id="chat-input" placeholder="Nhắn lời thì thầm lơ lửng giữa ngàn sao...">
            <button class="btn-send" id="btn-send">Gửi 🚀</button>
        </div>
    </div>

    <!-- LINH HỒN JAVASCRIPT: Tích hợp hệ thống gửi file âm thanh lơ lửng qua màng lọc chống quá tải -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');
        const fileInput = document.getElementById('file-input');

        // Khôi phục lịch sử chat cũ từ bộ nhớ ẩn trình duyệt
        function loadHistory() {
            let savedChat = localStorage.getItem('mat_dao_chat_history');
            if(savedChat && savedChat.trim() !== "") {
                chatBox.innerHTML = savedChat;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.onload = loadHistory;

        // MÀNG LỌC BẢO VỆ CHỐNG QUÁ TẢI (Rate Limiter Lock)
        let isSystemBusy = false;
        let globalAudioCount = 0; // Biến đếm để quản lý ID của các tệp audio gửi đi

        // HÀM MA THUẬT TỰ ĐỘNG DỆT THANH PHÁT NHẠC GỬI FILE QUA TIN NHẮN
        function sendAudioMessage() {
            globalAudioCount++;
            let audioId = `audio-player-${globalAudioCount}`;
            let btnId = `audio-btn-${globalAudioCount}`;

            // Chuỗi cấu trúc HTML của thanh phát nhạc mini lơ lửng giữa trời sao
            let audioHtml = `
                <div class="audio-message-player">
                    <!-- Nhúng thẻ audio gọi trực tiếp tệp nhacnen.mp3 chính chủ của anh -->
                    <audio id="${audioId}" preload="auto">
                        <source src="nhacnen.mp3" type="audio/mpeg">
                    </audio>
                    <button class="play-audio-btn" id="${btnId}" onclick="toggleAudioMessage('${audioId}', '${btnId}')">▶️</button>
                    <div class="audio-info-text">🎵 Giọng hát ru của em iu...</div>
                </div>
            `;
            return audioHtml;
        }

        // Hàm xử lý hành động bấm Phát/Dừng trực tiếp trên dòng chat chat
        window.toggleAudioMessage = function(audioId, btnId) {
            const player = document.getElementById(audioId);
            const btn = document.getElementById(btnId);
            
            // Tắt hết tất cả các file audio khác đang phát để chống loạn âm thanh
            document.querySelectorAll('audio').forEach(aud => {
                if (aud.id !== audioId && !aud.paused) {
                    aud.pause();
                    // Tìm nút tương ứng để reset icon về ▶️
                    let matchingBtnId = aud.id.replace('audio-player-', 'audio-btn-');
                    let matchingBtn = document.getElementById(matchingBtnId);
                    if (matchingBtn) matchingBtn.innerText = "▶️";
                }
            });

            if (player.paused) {
                player.play().then(() => {
                    btn.innerText = "⏸️";
                }).catch(e => alert("Anh yêu chạm khẽ vào khoảng trống trên màn hình một phát rồi bấm lại nút ▶️ nha!"));
            } else {
                player.pause();
                btn.innerText = "▶️";
            }
        };
