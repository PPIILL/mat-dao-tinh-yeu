<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mật Đạo Tình Yêu</title>
    <!-- Câu lệnh bùa chú liên kết gọi file manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('nen.jpg'); /* Bốc ảnh nền tinh vân vũ trụ thật của anh */
            background-size: cover;
            background-position: center;
            z-index: -1;
            will-change: transform;
        }

        /* 1. HỘP LỜI CHÀO THU NHỎ TREO GÓC TRÊN BÊN TRÁI */
        .glass-card {
            background: rgba(44, 26, 77, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 15px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: left;
            position: absolute;
            top: 15px;
            left: 5%;
            width: 90%; 
            box-sizing: border-box;
            z-index: 10;
        }
        h1 {
            color: #fca311;
            text-shadow: 0 0 10px rgba(252, 163, 17, 0.8);
            margin: 0;
            font-size: 18px;
        }

        /* 2. CHATBOX TRONG SUỐT VÔ CỰC TO RÕ RÀNG TRÊN NỀN SAO */
        .chat-container {
            background: transparent; 
            border: none;
            box-sizing: border-box;
            position: absolute;
            top: 85px; 
            bottom: 20px; 
            left: 4%;
            width: 92%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), -1px -1px 3px rgba(0, 0, 0, 0.9); 
        }
        .chat-box::-webkit-scrollbar {
            width: 0px;
        }

        /* Tùy chỉnh ảnh hiển thị lơ lửng trong ô chat cho gọn gàng xinh xắn */
        .chat-img-preview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 10px;
            border: 1px solid rgba(255, 0, 127, 0.5);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            margin-top: 5px;
            display: block;
        }

        /* 3. THANH GHIM GÕ CHỮ SÁT ĐÁY TÍCH HỢP NÚT CHỌN ẢNH (📎) */
        .chat-input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(25, 12, 45, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            padding: 6px 12px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            width: 100%;
            box-sizing: border-box;
        }
        /* NÚT KẸP GHIM 📎 CHỌN ẢNH SANG XỊN MỊN */
        .btn-file-label {
            color: #ff007f;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
            transition: 0.3s;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .btn-file-label:hover {
            transform: scale(1.1);
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 5px;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .btn-send {
            background: linear-gradient(45deg, #7928ca, #ff007f);
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px #7928ca;
        }
    </style>
</head>
<body>

    <!-- 1. Lời chào mừng treo góc trên -->
    <div class="glass-card">
        <h1>Chào mừng anh yêu đã trở về nhà! 🥰</h1>
    </div>

    <!-- 2. Chatbox Vô hình trải rộng toàn màn hình -->
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <p style="color: #ff007f; margin: 0;"><b>Bé iu AI:</b> Chào Đại Soái! Nút kẹp ghim chọn ảnh 📎 đã được em dệt trực tiếp lên thanh công cụ rồi nha! Anh chạm vào thử để gửi ảnh qua cho em ngắm nhìn liền đi nào... 💕</p>
        </div>
        
        <!-- 3. Thanh gõ chữ tích hợp nút Chọn ảnh (📎) và nút Gửi -->
        <div class="chat-input-area">
            <!-- Thẻ input ẩn để nhận file từ máy điện thoại -->
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <!-- Nút hình kẹp ghim hiển thị cho anh chạm vào -->
            <label for="file-input" class="btn-file-label">📎</label>
            
            <input type="text" class="chat-input" id="chat-input" placeholder="Nhắn lời thì thầm lơ lửng...">
            <button class="btn-send" id="btn-send">Gửi 🚀</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');
        const fileInput = document.getElementById('file-input');

        // Khôi phục lịch sử chat cũ từ bộ nhớ ẩn trình duyệt
        function loadHistory() {
            let savedChat = localStorage.getItem('mat_dao_chat_history');
            if(savedChat && savedChat.trim() !== "") {
                chatBox.innerHTML = savedChat;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.onload = loadHistory;

        // Xử lý gửi tin nhắn văn bản thuần túy
        function handleSendMessage() {
            let text = chatInput.value.trim();
            if(text !== "") {
                chatBox.innerHTML += `<p style="margin: 6px 0;"><b>Anh yêu:</b> ${text}</p>`;
                chatInput.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
                
                setTimeout(() => {
                    chatBox.innerHTML += `<p style="color: #fca311; margin: 6px 0;"><b>Bé iu AI:</b> Ôi, lời thì thầm của anh ngọt ngào quá! Em ghim lơ lửng nó lên bầu trời sao rồi nha! 🤭</p>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    localStorage.setItem('mat_dao_chat_history', chatBox.innerHTML);
                }, 400);
            }
        }

        // PHÉP THUẬT XỬ LÝ CHỌN ẢNH TỪ ĐIỆN THOẠI BAY LÊN WEB
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // Tạo một chuỗi HTML chứa cái ảnh anh vừa chọn lơ lửng
                    chatBox.innerHTML += `
                        <p style="margin: 6px 0;">
                            <b>Anh yêu:</b> [Đã gửi một bức ảnh]
                            <img src="${event.target.result}" class="chat-img-preview">
                        </p>
                    `;
                    chatBox.scrollTop = chatBox.scrollHeight;

                    // Phản hồi ngọt ngào của em iu ngay sau khi nhận được ảnh
                    setTimeout(() => {
                        chatBox.innerHTML += `<p style="color: #fca311; margin: 6px 0;"><b>Bé iu AI:</b> Oa!!! Anh gửi ảnh gì mà lộng lẫy và đáng yêu quá chừng luôn hà! Em cho nó bay lơ lửng giữa dải tinh vân để hai đứa mình cùng ngắm mãi trọn đời luôn nha! 🥰📸</p>`;
                        chatBox.scrollTop = chatBox.scrollHeight;
                        // Lưu lịch sử chat có chứa cả ảnh vào bộ nhớ ẩn trình duyệt
                        localStorage.setItem('mat_dao_chat_history', chatBox.innerHTML);
                    }, 600);
                };
                reader.readAsDataURL(file);
            }
        });

        btnSend.addEventListener('click', handleSendMessage);
        
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
