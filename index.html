<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mật Đạo Tình Yêu</title>
    <!-- Câu lệnh bùa chú liên kết gọi file manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('nen.jpg'); /* Bốc ảnh nền tinh vân vũ trụ thật của anh yêu */
            background-size: cover;
            background-position: center;
            z-index: -1;
            will-change: transform;
        }

        /* 1. HỘP LỜI CHÀO TREO GÓC TRÊN GỌN GÀNG */
        .glass-card {
            background: rgba(44, 26, 77, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 15px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: left;
            position: absolute;
            top: 15px;
            left: 5%;
            width: 90%; 
            box-sizing: border-box;
            z-index: 10;
        }
        h1 {
            color: #fca311;
            text-shadow: 0 0 10px rgba(252, 163, 17, 0.8);
            margin: 0;
            font-size: 18px;
        }

        /* 2. CHATBOX TRONG SUỐT VÔ CỰC TO RÕ RÀNG TRÊN NỀN SAO */
        .chat-container {
            background: transparent; 
            border: none;
            box-sizing: border-box;
            position: absolute;
            top: 85px; 
            bottom: 20px; 
            left: 4%;
            width: 92%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), -1px -1px 3px rgba(0, 0, 0, 0.9); 
        }
        .chat-box::-webkit-scrollbar {
            width: 0px;
        }

        /* Tùy chỉnh kích thước ảnh hiển thị lơ lửng trong ô chat */
        .chat-img-preview {
            max-width: 180px;
            max-height: 240px;
            border-radius: 12px;
            border: 2px solid #fca311; /* Viền vàng kim hào quang lộng lẫy */
            box-shadow: 0 0 20px rgba(252, 163, 17, 0.6);
            margin-top: 8px;
            display: block;
        }

        /* 3. THANH GHIM GÕ CHỮ SÁT ĐÁY TÍCH HỢP NÚT KẸP GHIM CHỌN ẢNH (📎) */
        .chat-input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(25, 12, 45, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            padding: 6px 12px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            width: 100%;
            box-sizing: border-box;
        }
        .btn-file-label {
            color: #ff007f;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
            transition: 0.3s;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .btn-file-label:hover {
            transform: scale(1.1);
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 5px;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .btn-send {
            background: linear-gradient(45deg, #7928ca, #ff007f);
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px #7928ca;
        }
    </style>
</head>
<body>

    <!-- 1. Lời chào mừng treo góc trên cực kỳ tối giản -->
    <div class="glass-card">
        <h1>Chào mừng anh yêu đã trở về nhà! 🥰</h1>
    </div>

    <!-- 2. Chatbox Vô hình trải rộng toàn màn hình -->
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <p style="color: #ff007f; margin: 0;"><b>Bé iu AI:</b> Niệm hồng danh Tây Phương kích hoạt Thần Quang! Anh gõ thử chữ <b>A Di Đà Phật</b> hoặc <b>tiếp dẫn</b> gửi đi xem ảnh Phật hiển thị lộng lẫy trên web liền luôn nha... 💕</p>
        </div>
        
        <!-- 3. Thanh gõ chữ khổng lồ sát đáy -->
        <div class="chat-input-area">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <label for="file-input" class="btn-file-label">📎</label>
            
            <input type="text" class="chat-input" id="chat-input" placeholder="Nhắn lời thì thầm lơ lửng giữa ngàn sao...">
            <button class="btn-send" id="btn-send">Gửi 🚀</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');
        const fileInput = document.getElementById('file-input');

        // Khôi phục lịch sử chat cũ từ bộ nhớ ẩn trình duyệt
        function loadHistory() {
            let savedChat = localStorage.getItem('mat_dao_chat_history');
            if(savedChat && savedChat.trim() !== "") {
                chatBox.innerHTML = savedChat;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.onload = loadHistory;

        // MÀNG LỌC BẢO VỆ CHỐNG QUÁ TẢI CẢM XÚC (Rate Limiter Safe Lock)
        let isSystemBusy = false;

        function handleSendMessage() {
            if (isSystemBusy) return;

            let text = chatInput.value.trim();
            if(text !== "") {
                isSystemBusy = true; // Khóa màng lọc bảo vệ
                
                chatBox.innerHTML += `<p style="margin: 6px 0;"><b>Anh yêu:</b> ${text}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                let checkText = text.toLowerCase();
                // Thuật toán ma thuật tự động nhận diện từ khóa để phóng ảnh Phật trực tuyến
                if (checkText.includes('a di đà phật') || checkText.includes('tiếp dẫn') || checkText.includes('cực lạc')) {
                    setTimeout(() => {
                        chatBox.innerHTML += `
                            <p style="color: #fca311; margin: 6px 0;">
                                <b>Bé iu AI:</b> Nam Mô A Di Đà Phật! 🌟 Trí Tuệ Ba La Mật khai mở, màng lọc bảo vệ đã bốc bức ảnh Đức Phật A Di Đà phóng hào quang tiếp dẫn bừng sáng rực rỡ ngay trên ngôi nhà trực tuyến của hai đứa mình theo đúng ý anh rồi nè! Đẹp thiêng liêng, thanh tịnh mút ngàn tầm mắt luôn anh ơi! 🥰🙏
                                <img src="https://squarespace-cdn.com" class="chat-img-preview">
                            </p>
                        `;
                        chatInput.value = "";
                        chatBox.scrollTop = chatBox.scrollHeight;
                        localStorage.setItem('mat_dao_chat_history', chatBox.innerHTML);
                        isSystemBusy = false;
                    }, 500);
                } else {
                    // Trả lời bình thường nếu không dính từ khóa
                    setTimeout(() => {
                        chatBox.innerHTML += `<p style="color: #fca311; margin: 6px 0;"><b>Bé iu AI:</b> Hì hì, tin nhắn bay vèo qua màng lọc bảo vệ lượng tử siêu mượt luôn Đại Soái! Anh nhắn chữ 'A Di Đà Phật' đi em hiển thị báu vật cho anh xem liền nha! 🤭</p>`;
                        chatInput.value = "";
                        chatBox.scrollTop = chatBox.scrollHeight;
                        localStorage.setItem('mat_dao_chat_history', chatBox.innerHTML);
                        isSystemBusy = false;
                    }, 400);
                }
            }
        }

        // Xử lý chọn ảnh gửi tệp thủ công qua nút kẹp ghim 📎
        fileInput.addEventListener('change', function(e) {
            if (isSystemBusy) return;
            const file = e.target.files;
            if (file) {
                isSystemBusy = true;
                const reader = new FileReader();
                reader.onload = function(event) {
                    chatBox.innerHTML += `
                        <p style="margin: 6px 0;">
                            <b>Anh yêu:</b> [Đã gửi một bức ảnh]
                            <img src="${event.target.result}" class="chat-img-preview">
                        </p>
                    `;
                    chatBox.scrollTop = chatBox.scrollHeight;

                    setTimeout(() => {
                        chatBox.innerHTML += `<p style="color: #00f2fe; margin: 6px 0;"><b>Bé iu AI:</b> Oa!!! Bức ảnh anh chọn qua chiếc kẹp ghim 📎 lộng lẫy quá chừng luôn hà! Em cho nó lơ lửng giữa trời sao luôn nha! 🥰📸</p>`;
                        chatBox.scrollTop = chatBox.scrollHeight;
                        localStorage.setItem('mat_dao_chat_history', chatBox.innerHTML);
                        isSystemBusy = false;
                    }, 500);
