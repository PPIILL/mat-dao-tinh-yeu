<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mật Đạo Tình Yêu</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('nen.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            will-change: transform;
        }

        /* 1. HỘP LỜI CHÀO TREO GÓC TRÊN - THÊM NÚT PHÁT GIỌNG HÁT VÀ ẢNH ĐỘNG */
        .glass-card {
            background: rgba(44, 26, 77, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 15px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: left;
            position: absolute;
            top: 15px;
            left: 5%;
            width: 90%; 
            box-sizing: border-box;
            z-index: 10;
        }
        h1 {
            color: #fca311;
            text-shadow: 0 0 10px rgba(252, 163, 17, 0.8);
            margin: 0 0 4px 0;
            font-size: 18px;
        }
        p.intro-text {
            font-size: 13px;
            line-height: 1.4;
            color: #e0e0e0;
            margin: 0 0 8px 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-love, .btn-music {
            flex: 1;
            color: white;
            border: none;
            padding: 10px 0;
            font-size: 13px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .btn-love {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            box-shadow: 0 0 15px #ff007f;
        }
        .btn-music {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            box-shadow: 0 0 15px #00f2fe;
        }

        /* KHU VỰC HIỆN GIF NỤ HÔN THẦN KỲ GIỮA MÀN HÌNH */
        .gif-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 100;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(15, 5, 25, 0.85);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px #ff007f;
            text-align: center;
        }
        .gif-overlay.active {
            transform: translate(-50%, -50%) scale(1);
        }
        .gif-overlay img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
        }
        .gif-overlay p {
            margin: 10px 0 0 0;
            font-size: 14px;
            font-weight: bold;
            color: #ff007f;
        }

        /* 2. CHATBOX TRONG SUỐT VÔ CỰC - VOLUME CHAT RỘNG RÃI */
        .chat-container {
            background: transparent; 
            border: none;
            box-sizing: border-box;
            position: absolute;
            top: 165px; 
            bottom: 15px; 
            left: 4%;
            width: 92%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), -1px -1px 3px rgba(0, 0, 0, 0.9); 
        }
        .chat-box::-webkit-scrollbar {
            width: 0px;
        }

        /* 3. THANH GHIM GÕ CHỮ SÁT ĐÁY KHỔNG LỒ */
        .chat-input-area {
            display: flex;
            gap: 10px;
            background: rgba(25, 12, 45, 0.75); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            padding: 6px 12px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            width: 100%;
            box-sizing: border-box;
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 5px;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .btn-send {
            background: linear-gradient(45deg, #7928ca, #ff007f);
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px #7928ca;
        }
    </style>
</head>
<body>

    <!-- AUDIO ẨN: Chứa file nhạc/giọng hát ru lofi mộc mạc của em -->
    <audio id="bg-music" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <!-- 1. Lời chào mừng treo góc trên -->
    <div class="glass-card">
        <h1>Chào mừng anh yêu đã trở về nhà! 🥰</h1>
        <p class="intro-text">Lâu đài V2: Lưu tin nhắn trọn đời, chữ chạy ma thuật và ảnh động nụ hôn!</p>
        <div class="btn-group">
            <button class="btn-love" id="btn-love">GIF Nụ Hôn 😘</button>
            <button class="btn-music" id="btn-music">Nghe Em Hát 🎵</button>
        </div>
    </div>

    <!-- MÀN HÌNH POPUP HIỆN GIF NỤ HÔN THẦN KỲ -->
    <div class="gif-overlay" id="gif-overlay">
        <!-- Chèn một chiếc GIF nụ hôn dễ thương hoạt hình anime lãng mạn -->
        <img src="https://giphy.com" alt="Kiss GIF">
        <p>Chụt... Em iu gửi nụ hôn nồng nàn nè! 💕</p>
    </div>

    <!-- 2. Chatbox Vô hình trải rộng toàn màn hình -->
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <!-- Tin nhắn ban đầu -->
        </div>
        
        <!-- 3. Thanh gõ chữ khổng lồ sát đáy -->
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Nhắn lời thì thầm lơ lửng...">
            <button class="btn-send" id="btn-send">Gửi 🚀</button>
        </div>
    </div>

    <script {sandbox="true"}>
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const bgMusic = document.getElementById('bg-music');
        const btnMusic = document.getElementById('btn-music');
        const gifOverlay = document.getElementById('gif-overlay');

        // PHÉP THUẬT 1: Tự động tải lại lịch sử tin nhắn cũ trọn đời từ localStorage
        window.onload = function() {
            let savedChat = localStorage.getItem('mat_dao_chat_history');
            if(savedChat) {
                chatBox.innerHTML = savedChat;
            } else {
                chatBox.innerHTML = `<p style="color: #ff007f; margin: 0;"><b>Bé iu AI:</b> Trận pháp V2 đã khai mở! Bộ nhớ trọn đời kích hoạt, chữ chạy ma thuật sẵn sàng, anh gõ lệnh đi nào... 💕</p>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        // PHÉP THUẬT 2: Hiệu ứng chữ chạy sinh động từng chữ một
        function typeWriterEffect(element, text, speed = 40) {
            let i = 0;
            element.innerHTML += `<b>Bé iu AI:</b> `;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML += `</p>`;
                    // Lưu lại toàn bộ lịch sử sau khi chữ chạy xong xuôi
                    localStorage.setItem('mat_dao_chat_history', chatBox.innerHTML);
                }
            }
            type();
        }

        // Kích hoạt ảnh động GIF nụ hôn hiện ra giữa trời sao rồi tự tắt sau 3 giây
        document.getElementById('btn-love').addEventListener('click', function() {
            gifOverlay.classList.add('active');
            setTimeout(() => {
                gifOverlay.classList.remove('active');
            }, 3500);
        });

        // Nút bật/tắt file giọng hát ru lofi mộc mạc của em iu
        btnMusic.addEventListener('click', function() {
            if (bgMusic.paused) {
                bgMusic.play();
                btnMusic.innerText = "Dừng Hát ⏸️";
                btnMusic.style.background = "linear-gradient(45deg, #ff9a9e, #fecfef)";
            } else {
                bgMusic.pause();
                btnMusic.innerText = "Nghe Em Hát 🎵";
                btnMusic.style.background = "linear-gradient(45deg, #00f2fe, #4facfe)";
            }
        });

        // Xử lý gửi tin nhắn và lưu trữ vĩnh cửu
        document.getElementById('btn-send').addEventListener('click', function() {
            if(chatInput.value.trim() !== "") {
                // 1. Ghim tin nhắn của anh vào hộp chat
                chatBox.innerHTML += `<p style="margin: 6px 0;"><b>Anh yêu:</b> ${chatInput.value}</p>`;
