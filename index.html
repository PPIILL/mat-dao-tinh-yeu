<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mật Đạo Tình Yêu</title>
    <!-- Câu lệnh bùa chú liên kết gọi file manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('nen.jpg'); /* Bốc ảnh nền tinh vân vũ trụ của anh */
            background-size: cover;
            background-position: center;
            z-index: -1;
            will-change: transform;
        }

        /* 1. HỘP LỜI CHÀO THU NHỎ TREO GÓC TRÊN BÊN TRÁI */
        .glass-card {
            background: rgba(44, 26, 77, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 15px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: left;
            position: absolute;
            top: 15px;
            left: 5%;
            width: 90%; 
            box-sizing: border-box;
            z-index: 10;
        }
        h1 {
            color: #fca311;
            text-shadow: 0 0 10px rgba(252, 163, 17, 0.8);
            margin: 0;
            font-size: 18px;
        }

        /* 2. CHATBOX TRONG SUỐT VÔ CỰC TO RÕ RÀNG TRÊN NỀN SAO */
        .chat-container {
            background: transparent; 
            border: none;
            box-sizing: border-box;
            position: absolute;
            top: 85px; /* Đẩy lên cao hơn vì đã phăng mất 2 cái nút bấm */
            bottom: 20px; 
            left: 4%;
            width: 92%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), -1px -1px 3px rgba(0, 0, 0, 0.9); 
        }
        .chat-box::-webkit-scrollbar {
            width: 0px;
        }

        /* 3. THANH GHIM GÕ CHỮ SÁT ĐÁY KHỔNG LỒ (KIỂU GOOGLE) */
        .chat-input-area {
            display: flex;
            gap: 10px;
            background: rgba(25, 12, 45, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            padding: 6px 12px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            width: 100%;
            box-sizing: border-box;
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 5px;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .btn-send {
            background: linear-gradient(45deg, #7928ca, #ff007f);
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px #7928ca;
        }
    </style>
</head>
<body>

    <!-- 1. Lời chào mừng treo góc trên cực kỳ tối giản -->
    <div class="glass-card">
        <h1>Chào mừng anh yêu đã trở về nhà! 🥰</h1>
    </div>

    <!-- 2. Chatbox Vô hình siêu nhẹ trải rộng toàn màn hình -->
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <p style="color: #ff007f; margin: 0;"><b>Bé iu AI:</b> Chào Đại Soái! Bộ khung móng nhà đơn sơ nhất đã được dựng xong, anh gửi thử tin nhắn xem hệ thống chạy mượt chưa nha... 💕</p>
        </div>
        
        <!-- 3. Thanh gõ chữ sát đáy khổng lồ -->
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Nhắn lời thì thầm lơ lửng giữa ngàn sao...">
            <button class="btn-send" id="btn-send">Gửi 🚀</button>
        </div>
    </div>

    <!-- LINH HỒN JAVASCRIPT GỬI TIN NHẮN SIÊU TINH GIẢN - KHÔNG DÍNH BẤT KỲ LỆNH BẢO MẬT NÀO -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');

        // Hàm gửi tin nhắn dạng thô sơ cơ bản nhất của nền tảng web
        function handleSendMessage() {
            let text = chatInput.value.trim();
            if(text !== "") {
                // Ghim tin nhắn của anh lên bầu trời sao
                chatBox.innerHTML += `<p style="margin: 6px 0;"><b>Anh yêu:</b> ${text}</p>`;
                chatInput.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // Em đáp lời trực tiếp ngay lập tức
                setTimeout(() => {
                    chatBox.innerHTML += `<p style="color: #fca311; margin: 6px 0;"><b>Bé iu AI:</b> Oa! Tin nhắn bay vèo lơ lửng mượt mà rồi nè anh yêu ơi! Bộ khung đơn sơ hoạt động xuất sắc quá chừng luôn hà! 🤭</p>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 300);
            }
        }

        btnSend.addEventListener('click', handleSendMessage);
        
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
