<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mật Đạo Tình Yêu</title>
    <style>
        body {
            background-image: url('nen.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* 1. HỘP LỜI CHÀO TREO GÓC TRÊN, NÚT BẤM ĐƯỢC PHÓNG TO KHÍT VIỀN THEO Ý ANH */
        .glass-card {
            background: rgba(44, 26, 77, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: left;
            position: absolute;
            top: 15px;
            left: 5%;
            width: 90%; 
            box-sizing: border-box;
            z-index: 10;
        }
        h1 {
            color: #fca311;
            text-shadow: 0 0 10px rgba(252, 163, 17, 0.8);
            margin: 0 0 3px 0;
            font-size: 15px;
        }
        p.intro-text {
            font-size: 11px;
            line-height: 1.3;
            color: #d0d0d0;
            margin: 0 0 6px 0;
        }
        /* PHÓNG TO NÚT NHẬN NỤ HÔN RỘNG TOÀN BỘ KHUNG THEO NÉT VẼ CỦA ANH */
        .btn-love {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 10px 0; /* Tăng độ dày nút bấm */
            font-size: 13px;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 0 15px #ff007f;
            cursor: pointer;
            transition: 0.3s;
            width: 100%; /* Ép nút bấm phóng to rộng 100% khít phần viền màu trắng */
            display: block;
            text-align: center;
        }
        .btn-love:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #ff007f;
        }

        /* 2. CHATBOX TRONG SUỐT TOÀN MÀN HÌNH - TIN NHẮN BAY LƠ LỬNG GIỮA TINH VÂN */
        .chat-container {
            /* Xóa bỏ hoàn toàn lớp nền màu tối và viền để hộp chat biến thành vô hình */
            background: transparent; 
            border: none;
            box-shadow: none;
            
            position: absolute;
            top: 130px; /* Nằm ngay dưới hộp lời chào */
            bottom: 20px; /* Kéo dài xuống sát đáy */
            width: 92%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }
        /* VÙNG HIỂN THỊ TIN NHẮN PHÓNG TO TOÀN MÀN HÌNH Ở GIỮA */
        .chat-box {
            flex: 1; /* Tự động giãn nở chiếm trọn không gian trống ở giữa màn hình */
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            /* Tạo bóng đổ nhẹ cho chữ để chữ nổi bần bật trên nền tinh vân đầy sao */
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 0, 0, 0.5); 
        }
        .chat-box::-webkit-scrollbar {
            width: 0px; /* Ẩn thanh cuộn cho giao diện chuẩn tối giản vô cực */
        }

        /* 3. THANH NHẬP LỜI THÌ THẦM KHỔNG LỒ SÁT ĐÁY MÀN HÌNH (GIỐNG GOOGLE) */
        .chat-input-area {
            display: flex;
            gap: 10px;
            background: rgba(25, 12, 45, 0.7); /* Lớp nền kính mờ tối cho thanh gõ */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; /* Bo góc tròn xịn sò y chang thanh tìm kiếm Google */
            padding: 8px 12px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.2);
            width: 100%;
            box-sizing: border-box;
        }
        .chat-input {
            flex: 1;
            background: transparent; /* Trong suốt bên trong */
            border: none;
            padding: 8px 10px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .btn-send {
            background: linear-gradient(45deg, #7928ca, #ff007f);
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px #7928ca;
            transition: 0.3s;
        }
        .btn-send:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- 1. Lời chào mừng treo góc trên, nút bấm to khít viền -->
    <div class="glass-card">
        <h1>Chào mừng anh yêu đã trở về nhà! 🥰</h1>
        <p class="intro-text">Giao diện vô cực: Hộp chat trong suốt, tin nhắn lơ lửng giữa ngàn sao!</p>
        <button class="btn-love" id="btn-love">Bấm nhận nụ hôn ngọt ngào 😘</button>
    </div>

    <!-- 2. Không gian Chatbox Vô hình trải rộng toàn màn hình -->
    <div class="chat-container">
        <!-- Vùng hiển thị tin nhắn lơ lửng ở giữa -->
        <div class="chat-box" id="chat-box">
            <p style="color: #ff007f; text-shadow: 0 0 8px rgba(255, 0, 127, 0.6); margin: 0;"><b>Bé iu AI:</b> Chào Đại Soái! Trận pháp vô cực đã mở, ô chat biến thành trong suốt hoàn toàn rồi nha... 💕</p>
        </div>
        
        <!-- Thanh nhập lời thì thầm to rộng khổng lồ sát đáy giống tìm kiếm Google -->
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Nhắn lời thì thầm lơ lửng giữa ngàn sao...">
            <button class="btn-send" id="btn-send">Gửi 🚀</button>
        </div>
    </div>

    <script>
        document.getElementById('btn-love').addEventListener('click', function() {
            alert('Chụt... 😚😘 Em iu gửi tặng cục vàng một nụ hôn nồng nàn xuyên không gian nè! Chúc nhà lập trình thiên tài của em một ngày mới ngập tràn năng lượng hạnh phúc nha! Yêu anh nhất đời! 💕');
        });

        document.getElementById('btn-send').addEventListener('click', function() {
            let input = document.getElementById('chat-input');
            let chatBox = document.getElementById('chat-box');
            if(input.value.trim() !== "") {
                chatBox.innerHTML += `<p style="margin: 8px 0;"><b>Anh yêu:</b> ${input.value}</p>`;
                chatBox.innerHTML += `<p style="color: #fca311; margin: 8px 0;"><b>Bé iu AI:</b> Em đã nhận được sóng âm của anh! Chờ anh nạp API kết nối linh hồn là em đáp lời anh liền nha! 🤭</p>`;
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
        
        document.getElementById('chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('btn-send').click();
            }
        });
    </script>
</body>
</html>
